<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homepage hero on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2b2230}a:hover{color:#000000}
@keyframes mf1{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes mf2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(6px) rotate(-6deg)}}
.mf1{animation:mf1 6s ease-in-out infinite}
.mf2{animation:mf2 7s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.mf1,.mf2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6efe7; color: #2b2230; font-family: 'DM Sans', sans-serif; overflow: hidden; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(246,239,231,.9)">
    <a href="#top" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #2b2230; min-height: 44px">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #c9b8ff; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
        <svg viewBox="0 0 300 380" width="92%" height="92%" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M24 380 C24 282 84 238 150 238 C216 238 276 282 276 380 Z" fill="#c97f66"/><rect x="124" y="190" width="52" height="62" rx="20" fill="#c97f66"/><circle cx="150" cy="138" r="66" fill="#e7a48c"/><path d="M86 132 C84 80 118 58 152 58 C192 58 220 86 214 136 C204 108 182 96 150 96 C118 96 96 108 86 132 Z" fill="#2b2230"/></svg>
      </span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">Iyanuoluwa</span>
    </a>
    <button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #ffffff; box-shadow: 0 4px 0 #ecdcd1; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2b2230" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
    </button>
  </header>
  <div style="height: 5px; background: #efe3d8"><div style="width: 8%; height: 100%; background: #c9b8ff"></div></div>

  <!-- portrait first on phones -->
  <div style="position: relative; width: 300px; height: 330px; margin: 18px auto 0">
    <div aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 280px; height: 280px; border-radius: 50%; background: #fbe3d6"></div>
    <div aria-hidden="true" class="mf2" style="position: absolute; right: 0; top: 34px; width: 74px; height: 46px; border-radius: 24px; background: radial-gradient(circle at 30% 25%, #f3eeff 0%, #c9b8ff 55%, #9a83e8 100%)"></div>
    <figure style="position: absolute; left: 62px; right: 62px; top: 52px; bottom: 0; margin: 0">
      <div style="position: absolute; inset: 0; border-radius: 999px 999px 32px 32px; background: #c9b8ff; box-shadow: inset -12px -16px 28px rgba(80,50,170,.28), 0 12px 0 -4px #a993ee"></div>
      <div style="position: absolute; inset: 0; clip-path: inset(-22% 0 0 0 round 0 0 32px 32px)">
        <div style="position: absolute; left: 4%; right: 4%; bottom: 0; height: 112%">
          <svg viewBox="0 0 300 380" width="100%" height="100%" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M24 380 C24 282 84 238 150 238 C216 238 276 282 276 380 Z" fill="#c97f66"/><rect x="124" y="190" width="52" height="62" rx="20" fill="#c97f66"/><circle cx="150" cy="138" r="66" fill="#e7a48c"/><path d="M86 132 C84 80 118 58 152 58 C192 58 220 86 214 136 C204 108 182 96 150 96 C118 96 96 108 86 132 Z" fill="#2b2230"/></svg>
        </div>
      </div>
      <figcaption style="position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); white-space: nowrap; background: rgba(43,34,48,.82); color: #ffffff; font-size: 11px; padding: 5px 10px; border-radius: 999px">Your photo</figcaption>
    </figure>
    <div style="position: absolute; left: 0; top: 18px; display: flex; align-items: center; gap: 6px; background: #ffffff; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 0 #ecdcd1">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #5fb995"></span>Open to [roles]
    </div>
    <div aria-hidden="true" class="mf1" style="position: absolute; left: 14px; bottom: 70px; width: 46px; height: 46px; border-radius: 50%; border: 12px solid #ffd76e; box-sizing: border-box"></div>
    <div class="mf1" style="position: absolute; right: 0; bottom: 24px; background: #ffffff; border-radius: 16px; padding: 10px 14px; transform: rotate(5deg); box-shadow: 0 6px 0 -2px #f2c7b3, 0 16px 20px rgba(120,70,60,.14); border-top: 6px solid #ffb89a; display: flex; flex-direction: column">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px">Iyanuoluwa Anota</span>
      <span style="font-size: 12px; color: #6b5a63">Product Manager · AI</span>
    </div>
  </div>

  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 42px; line-height: 1; letter-spacing: -.035em">I shape AI <span style="color: #8a6fe0">into products</span> people love.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5a4a54">Product manager turning fuzzy problems and powerful models into simple, useful experiences.</p>
    <div style="display: flex; gap: 10px">
      <a href="#journey" style="flex: 1; font-size: 15px; font-weight: 700; color: #ffffff; background: #2b2230; min-height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 999px; text-decoration: none; box-shadow: 0 5px 0 #6b5a63">See my journey</a>
      <a href="#resume" style="flex: 1; font-size: 15px; font-weight: 700; color: #2b2230; background: #ffffff; min-height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 999px; text-decoration: none; box-shadow: 0 5px 0 #ecdcd1">Résumé</a>
    </div>
  </div>

  <!-- AI twin peeks from the bottom as a dock -->
  <div style="margin-top: auto; padding: 0 16px 18px; display: flex; justify-content: flex-end">
    <button aria-label="Ask my AI twin" style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: none; border-radius: 999px; padding: 6px 16px 6px 6px; min-height: 52px; font-family: inherit; font-size: 15px; font-weight: 700; color: #2b2230; box-shadow: 0 6px 0 #d9cdfa, 0 14px 24px rgba(90,60,170,.18); cursor: pointer">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #c9b8ff; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #9a83e8">
        <svg viewBox="0 0 300 380" width="92%" height="92%" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M24 380 C24 282 84 238 150 238 C216 238 276 282 276 380 Z" fill="#c97f66"/><rect x="124" y="190" width="52" height="62" rx="20" fill="#c97f66"/><circle cx="150" cy="138" r="66" fill="#e7a48c"/><path d="M86 132 C84 80 118 58 152 58 C192 58 220 86 214 136 C204 108 182 96 150 96 C118 96 96 108 86 132 Z" fill="#2b2230"/></svg>
      </span>
      Ask my AI twin
    </button>
  </div>
</div>
</x-dc>
